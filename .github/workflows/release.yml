# ─────────────────────────────────────────────────────────────────────────────
# GameLoop Tuner — native C++20 release.
#
# Produces two standalone variant binaries with:
#   * static CRT (/MT)  → no vcruntime140.dll beside them
#   * LTCG + /O1        → size-optimised
#   * an embedded requireAdministrator manifest
#   * mythic.ico as the executable icon
#
#   build/bin/GameLoopTuner-Beta.exe  (GLT_TARGET_BETA)
#   build/bin/GameLoopTuner-Hub.exe   (GLT_TARGET_HUB)
#
# The python build's .spec files and PyInstaller step are gone. requirements.txt
# is only used for the archive job, which packages the legacy sources.
# ─────────────────────────────────────────────────────────────────────────────
name: Release

on:
  # `push` MUST be a list here, not two sibling mappings. A `branches:` and a
  # `tags:` filter in the SAME mapping are AND-ed -- and a push is either a
  # branch push or a tag push, never both -- so they can never be combined that
  # way. Listing them as two entries under one `push:` is the only form where
  # both fire.
  #
  # This was previously written as two sibling `push:` keys. YAML silently keeps
  # the last duplicate, so the `tags: ['v*']` half was discarded and pushing a
  # release tag did nothing at all. Parsing this file does not error, and the
  # workflow shows as "active" in the UI, which is what made it easy to miss.
  push:
    - tags:
        - 'v*'
    - branches:
        - main
      paths:
        - 'native/**'
        - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release under (e.g. v2.0.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  # ── Windows build ───────────────────────────────────────────────────────────
  build:
    name: Build (windows-latest, MSVC)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          cmake --version
          Write-Host "--- VS ---"
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x64 `
            -property installationPath

      # Third-party sources are downloaded once and cached, so a rebuild after a
      # one-line change does not re-fetch imgui / sqlite3 / json.
      - name: Restore third-party cache
        id: thirdparty
        uses: actions/cache@v4
        with:
          path: native/third_party
          key: thirdparty-${{ hashFiles('native/CMakeLists.txt') }}
          restore-keys: thirdparty-

      - name: Fetch and vendor third-party sources
        if: steps.thirdparty.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force native/third_party | Out-Null

          Write-Host "--- sqlite3 amalgamation ---"
          $zip = "$env:RUNNER_TEMP\sqlite.zip"
          Invoke-WebRequest `
            -Uri "https://sqlite.org/2025/sqlite-amalgamation-3500400.zip" `
            -OutFile $zip
          $expected = "1d3049dd0f830a025a53105fc79fd2ab9431aea99e137809d064d8ee8356b032"
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) {
            throw "sqlite3 checksum mismatch`n  expected $expected`n  actual   $actual"
          }
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\sqlite" -Force
          Copy-Item "$env:RUNNER_TEMP\sqlite\sqlite-amalgamation-3500400\*" `
                    "native/third_party/sqlite3" -Recurse -Force

          Write-Host "--- imgui ---"
          git clone --depth 1 --branch v1.91.9b `
              https://github.com/ocornut/imgui.git native/third_party/imgui

          Write-Host "--- nlohmann/json ---"
          git clone --depth 1 --branch v3.11.3 `
              https://github.com/nlohmann/json.git native/third_party/json

      - name: Configure
        run: cmake -S native -B build -G Ninja -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE

      - name: Build
        run: cmake --build build --config $env:BUILD_TYPE --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure -C $env:BUILD_TYPE

      - name: Verify the embedded manifest requests elevation
        run: |
          $exes = @("build\bin\GameLoopTuner-Beta.exe", "build\bin\GameLoopTuner-Hub.exe")
          foreach ($exe in $exes) {
            if (-not (Test-Path $exe)) { throw "executable not found at $exe" }
          }

          $mt = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\$(
            (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Directory |
             Sort-Object Name -Descending | Select-Object -First 1).Name
          )\x64\mt.exe"
          if (Test-Path $mt) {
            Write-Host "--- mt.exe -inputresource:manifest ---"
            & $mt "-inputresource:$($exes[0]);#1" "-out:build\extracted.manifest"
            Get-Content build\extracted.manifest
          } else {
            Write-Host "mt.exe not found - skipping manifest extraction"
          }

      - name: Verify there are no external DLL dependencies
        run: |
          # A stray vcruntime140.dll next to the exe would defeat the whole
          # point of /MT, so assert the import table is system-only.
          $exes = @("build\bin\GameLoopTuner-Beta.exe", "build\bin\GameLoopTuner-Hub.exe")
          $dumpbin = (Get-ChildItem `
            "${env:ProgramFiles\Microsoft Visual Studio\2022\*\VC\Tools\MSVC\*\bin\Hostx64\x64" `
            -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1).FullName

          if (-not $dumpbin) { Write-Host "dumpbin not found - skipping"; exit 0 }

          $system = @('api-ms-win-crt', 'kernel32', 'user32', 'gdi32', 'advapi32',
                      'shell32', 'ole32', 'd3d11', 'dxgi', 'psapi', 'shlwapi',
                      'comctl32', 'imm32', 'winmm', 'ws2_32', 'crypt32',
                      'd3dcompiler_47', 'dwmapi')
          foreach ($exe in $exes) {
            Write-Host "--- $exe ---"
            $imports = & $dumpbin /NOLOGO /DEPENDENTS $exe
            $imports | Write-Host

            $bad = @()
            foreach ($line in $imports) {
              if ($line -match '^\s+([A-Za-z0-9_\-\.]+)\.dll\s*$') {
                $dll = $Matches[1]
                if ($system -notcontains $dll.ToLower()) { $bad += $dll }
              }
            }
            if ($bad.Count -gt 0) {
              throw "unexpected DLL dependencies in ${exe}: $($bad -join ', ')"
            }
            if ($imports -match 'vcruntime140|msvcp140|ucrtbase') {
              throw "dynamic CRT linked in $exe - /MT was not applied"
            }
          }

      - name: Report size
        run: |
          foreach ($name in @("GameLoopTuner-Beta.exe", "GameLoopTuner-Hub.exe")) {
            $exe = Get-Item "build\bin\$name"
            "{0}: {1:N0} bytes ({2:N2} MB)" -f $name, $exe.Length, ($exe.Length / 1MB) | Write-Host

            # Measured on MSVC 19.51 / SQLite 3.50.4 / imgui 1.91.9b:
            #   .text  ~1.39 MB   of which sqlite3.c is ~622 KB and imgui ~249 KB
            #   .rdata ~487 KB
            # 2 MB is the regression line, not the target.
            if ($exe.Length -gt 2MB) {
              throw "$name is $($exe.Length / 1MB) MB, over the 2 MB regression line"
            }
          }

      - name: Report installer size
        run: |
          $setup = Get-Item "build\bin\GameLoopTunerSetup.exe"
          "{0:N0} bytes ({1:N2} MB)" -f $setup.Length, ($setup.Length / 1MB) | Write-Host

          # The whole reason native/installer/ exists instead of Inno Setup is
          # that it stays tiny: it links no imgui and no DX11, only
          # Win32/GDI/Shell/Advapi32. If this climbs past 256 KB, something has
          # started linking glt_core into it and the win is gone. The budget is
          # loose on purpose — a linked glt_core would be ~1.7 MB, so this
          # catches the regression without failing on toolchain drift.
          if ($setup.Length -gt 256KB) {
            throw "installer is $($setup.Length / 1KB) KB, over the 256 KB budget"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameLoopTuner-windows
          path: |
            build/bin/GameLoopTuner-Beta.exe
            build/bin/GameLoopTuner-Hub.exe
            build/bin/GameLoopTunerSetup.exe
          if-no-files-found: error

  # ── Release ─────────────────────────────────────────────────────────────────
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: GameLoopTuner-windows
          path: dist

      - name: Package the installer pair
        run: |
          # GameLoopTunerSetup.exe locates the app payload relative to its own
          # path (setup.cpp: run_install), accepting either variant name, so the
          # installer must ship beside the build the user wants. The standalone
          # variant exes are still published separately for people who prefer to
          # run one without installing.
          cd dist
          zip -j GameLoopTuner-Beta.zip GameLoopTunerSetup.exe GameLoopTuner-Beta.exe
          zip -j GameLoopTuner-Hub.zip GameLoopTunerSetup.exe GameLoopTuner-Hub.exe
          rm GameLoopTunerSetup.exe
          ls -la

      - name: Generate SHA256SUMS.txt
        run: |
          cd dist
          sha256sum GameLoopTuner-Beta.exe GameLoopTuner-Hub.exe \
                    GameLoopTuner-Beta.zip GameLoopTuner-Hub.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: GameLoop Tuner ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist/GameLoopTuner-Beta.exe
            dist/GameLoopTuner-Hub.exe
            dist/GameLoopTuner-Beta.zip
            dist/GameLoopTuner-Hub.zip
            dist/SHA256SUMS.txt
          body: |
            ## GameLoop Tuner — native build

            Two builds, one per GameLoop variant. Pick the one that matches your install:

            * **`GameLoopTuner-Beta.zip`** / **`GameLoopTuner-Beta.exe`** — for the
              original validated **GameLoop Beta** client.
            * **`GameLoopTuner-Hub.zip`** / **`GameLoopTuner-Hub.exe`** — for the
              multi-app **GameLoop Hub (TAC)** client (e.g. `C:\ARENA\GameLoop`).

            The `GameLoopTuner-Beta.zip` / `GameLoopTuner-Hub.zip` archives contain the app
            plus `GameLoopTunerSetup.exe`; unzip and run the installer. The bare `.exe`
            is the portable build. On first launch the tuner asks which GameLoop you
            have and remembers the answer.

            Either way: no runtime, no DLLs, no temp unpacking.

            * Both ask for **administrator**. GameLoop recreates the emulator
              from LocalSystem, and the close ladder has to be able to
              terminate SYSTEM-owned processes.
            * Unsigned. Windows SmartScreen may warn on first run — choose
              *More info → Run anyway*.
            * Verify the download against `SHA256SUMS.txt`.

            Licensed under Apache-2.0. See `LICENSE` and `NOTICE` in the
            repository.